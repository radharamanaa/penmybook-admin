[project]
name = "book-admin"
version = "0.1.0"
description = "BookForge admin control-plane microservice — operator levers for generation concurrency, the quota-resume gate, and a global pause. Reads/writes a singleton settings doc in the shared Mongo; the worker and curator enforce."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web stack
    "fastapi[standard]>=0.136.0",
    "uvicorn[standard]>=0.30.0",
    # Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Mongo (async)
    "motor>=3.7.1",
    # Closed admin auth — PyJWT per ADR 0002 (python-jose is banned: CVE backlog)
    "pyjwt>=2.9.0",
    "bcrypt>=4.1.0",
    # admin→BookForge config pushes
    "httpx>=0.27.0",
    # Structured JSON logging (matches other services)
    "python-json-logger>=2.0.7",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: end-to-end tests requiring the live docker stack (deselect with '-m \"not integration\"')",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportPrivateImportUsage = false
