# PROD override for the BookForge ADMIN stack (separate compose, separate network).
# Applied as:
#   docker compose -f admin/docker-compose.yml -f admin/docker-compose.prod.yml \
#       up -d admin-spa book_admin admin-api
#
# - Points book_admin at the managed admin DocumentDB cluster over TLS (CA bundle
#   mounted at /certs; the SSM-hydrated ADMIN_MONGODB_URL MUST carry
#   ?tls=true&tlsCAFile=/certs/global-bundle.pem&retryWrites=false).
# - Parks the local admin_mongo (replaced by the managed cluster) so the curated
#   `up` never starts a local Mongo.
# - Caps the admin-api JVM heap for the shared 16 GiB box (≈1.8 GiB total heap
#   across entitlements/billing/org/admin-api).
name: bookforge-admin

services:
  admin-api:
    environment:
      JAVA_TOOL_OPTIONS: ${ADMIN_API_JAVA_OPTS:--Xmx384m -Xss512k}
      # Control-plane moved to ECS (Cloud Map) — was host.docker.internal:1810x (box).
      ENTITLEMENTS_URL: http://entitlements.pmb.local:8101
      BILLING_URL: http://billing.pmb.local:8102
      ORG_URL: http://org.pmb.local:8103

  book_admin:
    environment:
      # Admin data (admin_users/audit) lives in the `bookforge_admin` DATABASE on the
      # shared APP DocumentDB cluster (MONGODB_URL), not a dedicated admin cluster —
      # collapsed 2026-07-11 to drop the 2nd db.t3.medium (~$65/mo) at 2-user scale.
      # DB-level separation (MONGODB_DB_NAME=bookforge_admin, default) keeps admin data
      # namespaced; the one-way app<-admin trust is enforced at the API/JWT layer.
      MONGODB_URL: ${MONGODB_URL}
      # book_admin calls curator; default is host.docker.internal:8000 (box). On the
      # admin island curator is on ECS → Cloud Map. (admin-api's ENTITLEMENTS/BILLING/
      # ORG_URL are already repointed above; this was the one host.docker.internal miss.)
      CURATOR_INTERNAL_URL: http://curator.pmb.local:8000
    volumes:
      - ${RDS_CA_BUNDLE_HOST_PATH:-/opt/bookforge/certs}:/certs:ro

  # admin_mongo is replaced by the managed admin DocumentDB cluster — parked as an
  # idle no-op so the curated `up admin-spa book_admin admin-api` never starts it.
  admin_mongo:
    image: busybox
    restart: "no"
    command: ["sh", "-c", "sleep infinity"]
