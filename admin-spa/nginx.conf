# BookForge admin SPA — the ONLY thing the operator's browser talks to.
# /py/*  -> book_admin (auth, config push, accounts, audit, analytics proxy)
# /api/* -> admin-api  (users/money/pricing/waitlist)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the shell; hashed assets are immutable.
    location = /index.html { add_header Cache-Control "no-store"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location ^~ /py/ {
        set $book_admin_upstream book_admin;
        rewrite ^/py/(.*)$ /$1 break;
        proxy_pass http://$book_admin_upstream:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        resolver 127.0.0.11 valid=10s;
    }

    location ^~ /api/ {
        set $admin_api_upstream admin-api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$admin_api_upstream:8104;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        resolver 127.0.0.11 valid=10s;
    }

    location / { try_files $uri /index.html; }
}
