# BookForge admin SPA — the ONLY thing the operator's browser talks to.
# /py/*  -> book_admin (auth, config push, accounts, audit, analytics proxy)
# /api/* -> admin-api  (users/money/pricing/waitlist)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clickjacking / sniffing defence on every document response. This origin
    # drives account, money, pricing, and config-push actions and is never meant
    # to be framed. X-Frame-Options covers legacy UAs; CSP frame-ancestors covers
    # modern ones. HSTS is intentionally omitted — TLS terminates at the edge.
    # nginx drops these inherited add_headers inside any location that declares
    # its own add_header, so they are re-stated in the shell + asset blocks.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Never cache the shell; hashed assets are immutable. Re-state the security
    # headers here — these blocks declare their own add_header, which drops the
    # server-level ones above.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ^~ /py/ {
        set $book_admin_upstream book_admin;
        rewrite ^/py/(.*)$ /$1 break;
        proxy_pass http://$book_admin_upstream:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        resolver 127.0.0.11 valid=10s;
    }

    location ^~ /api/ {
        set $admin_api_upstream admin-api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$admin_api_upstream:8104;
        # A staff payout calls Stripe inline and admin-api waits up to 60s for billing; the
        # default 60s read timeout would cut it at the same moment and show a 504.
        proxy_read_timeout 75s;
        send_timeout 75s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        resolver 127.0.0.11 valid=10s;
    }

    location / { try_files $uri /index.html; }
}
